<text x='72' y='140' font-size='12' fill='#3b3626'>① 脸：独立网格 + 形态键（grin_wide / grin_open / face_tear / face_collapse）</text><text x='72' y='157' font-size='12' fill='#3b3626'>② 眼比笑嘴靠后约 5 cm：移动时视差「不对」</text><text x='72' y='174' font-size='12' fill='#3b3626'>③ 身体：空洞柱，菲涅尔边缘 + 透明度 0.85</text><text x='72' y='191' font-size='12' fill='#3b3626'>④ 灰色虚线：平时折在身后的 4 节手臂</text>
